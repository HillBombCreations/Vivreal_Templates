name: Sync main to site branches

on:
  push:
    branches:
      - main

# Serialize sync runs: two pushes to main must not merge/push the same site
# branches concurrently (that would race the git refs). Queue them instead of
# cancelling — every main push must eventually reach every site branch.
concurrency:
  group: sync-main-to-sites
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1.4 — authenticate as the Vivreal GitHub App (contents:write on this repo)
      # instead of the long-lived TOKEN_FOR_GITHUIB PAT. Scope the installation
      # token to this repo only; feed it to checkout so the batched push below
      # authenticates as the App.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VIVREAL_GH_APP_ID }}
          private-key: ${{ secrets.VIVREAL_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # One full-history checkout for the whole run — no per-branch clone.
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # 1.3 — single job: discover every site branch, merge main into each in
      # process, batch-push the successes, then send ONE report. Replaces the
      # matrix-per-branch design (256-job/run hard cap) and the N full clones.
      - name: Sync main into all site branches
        id: sync
        env:
          TEMPLATE_SYNC_WEBHOOK_URL: ${{ secrets.TEMPLATE_SYNC_WEBHOOK_URL }}
          TEMPLATE_SYNC_WEBHOOK_SECRET: ${{ secrets.TEMPLATE_SYNC_WEBHOOK_SECRET }}
          TEMPLATE_REPO: ${{ github.repository }}
          # Refspecs per git-push invocation. A batched push still fires one push
          # webhook per ref (each triggers that site's Amplify build — required).
          PUSH_BATCH_SIZE: "50"
        run: |
          # No `set -e`: one branch's failure must never stop the loop. We handle
          # every failure explicitly and exit nonzero at the very end.
          set -uo pipefail

          git config user.name "Vivreal Bot"
          git config user.email "bot@vivreal.io"

          # --- Discover all non-main remote branches -----------------------------
          # List each remote branch by its bare name (refname:lstrip=3 drops the
          # refs/remotes/origin/ prefix) and drop exactly `main` and `HEAD`.
          # Whole-name matching (grep -vxE) is deliberate: a substring filter like
          # `grep -v origin/main` would also silently exclude any real site branch
          # whose name merely CONTAINS "main" — e.g. `mainstreet-dental` (ref line
          # origin/mainstreet-dental) — leaving it unsynced forever. Anchoring to the
          # full ref name fixes that and drops the sed/whitespace handling.
          mapfile -t BRANCHES < <(
            git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin \
              | grep -vxE 'main|HEAD'
          )
          echo "Discovered ${#BRANCHES[@]} site branch(es) to sync."

          # Accumulators. SYNCED = merged-and-pending-push; the rest are terminal.
          SYNCED=()          # merged cleanly, awaiting push
          PUSHED=()          # merged AND pushed — the real successes
          CONFLICTS=()       # merge conflicts + per-branch infra failures
          PUSH_FAILED=()     # merged but push rejected
          declare -A REASON  # branch -> merge_conflict | push_failure | infra_failure

          # --- Merge loop --------------------------------------------------------
          # For each branch: create/reset a local ref from the remote branch and
          # merge origin/main. A conflict is aborted and recorded, then we move on.
          for BRANCH in "${BRANCHES[@]}"; do
            if ! git checkout -B "$BRANCH" "origin/$BRANCH"; then
              echo "::error::Could not check out $BRANCH from origin/$BRANCH — skipping."
              CONFLICTS+=("$BRANCH")
              REASON["$BRANCH"]="infra_failure"
              continue
            fi

            if git merge origin/main --no-edit -m "chore: sync main → $BRANCH"; then
              SYNCED+=("$BRANCH")
              echo "Merged main → $BRANCH"
            else
              git merge --abort || true
              echo "::error::Merge conflict syncing main → $BRANCH — left untouched, reported to portal."
              CONFLICTS+=("$BRANCH")
              REASON["$BRANCH"]="merge_conflict"
            fi
          done

          # --- Batched push ------------------------------------------------------
          # Push merged branches ~PUSH_BATCH_SIZE refspecs at a time. If a batch
          # push fails, retry that batch's refs individually so one rejected ref
          # never loses the rest of the batch.
          BATCH_SIZE="${PUSH_BATCH_SIZE:-50}"

          push_refs() {  # push_refs ref... -> records PUSHED / PUSH_FAILED
            if [ "$#" -eq 0 ]; then
              return 0
            fi
            if git push origin "$@"; then
              PUSHED+=("$@")
              echo "Pushed batch: $*"
              return 0
            fi
            echo "::warning::Batch push failed ($*) — retrying each ref individually to isolate the failure."
            local ref
            for ref in "$@"; do
              if git push origin "$ref"; then
                PUSHED+=("$ref")
                echo "Pushed $ref"
              else
                echo "::error::Push failed for $ref."
                PUSH_FAILED+=("$ref")
                REASON["$ref"]="push_failure"
              fi
            done
          }

          BATCH=()
          for BRANCH in "${SYNCED[@]}"; do
            BATCH+=("$BRANCH")
            if [ "${#BATCH[@]}" -ge "$BATCH_SIZE" ]; then
              push_refs "${BATCH[@]}"
              BATCH=()
            fi
          done
          push_refs "${BATCH[@]}"
          BATCH=()

          # Every failed branch (conflict, infra, or push) — one flat list.
          FAILED=("${CONFLICTS[@]}" "${PUSH_FAILED[@]}")

          # --- JSON helpers ------------------------------------------------------
          # git ref names cannot contain quotes/backslashes/controls, but escape
          # defensively so a pathological branch name can never break the payload.
          json_escape() {
            local s=$1
            s=${s//\\/\\\\}
            s=${s//\"/\\\"}
            s=${s//$'\n'/\\n}
            s=${s//$'\r'/\\r}
            s=${s//$'\t'/\\t}
            printf '%s' "$s"
          }
          json_string_array() {  # json_string_array item... -> ["a","b"]
            local out="[" first=1 item
            for item in "$@"; do
              if [ "$first" -eq 1 ]; then first=0; else out+=","; fi
              out+="\"$(json_escape "$item")\""
            done
            printf '%s]' "$out"
          }
          json_reason_map() {  # json_reason_map branch... -> {"a":"merge_conflict"}
            local out="{" first=1 b
            for b in "$@"; do
              if [ "$first" -eq 1 ]; then first=0; else out+=","; fi
              out+="\"$(json_escape "$b")\":\"$(json_escape "${REASON[$b]}")\""
            done
            printf '%s}' "$out"
          }

          # --- One batched report to the portal, only when something failed ------
          # Replaces the old per-branch report step. VR_Secure_API's endpoint
          # accepts arrays and ignores unknown keys, so one call is correct.
          # Best-effort: a webhook error must never mask the real sync failure.
          if [ "${#FAILED[@]}" -gt 0 ]; then
            if [ -z "${TEMPLATE_SYNC_WEBHOOK_URL:-}" ] || [ -z "${TEMPLATE_SYNC_WEBHOOK_SECRET:-}" ]; then
              echo "::warning::TEMPLATE_SYNC_WEBHOOK_URL/SECRET not configured — cannot report ${#FAILED[@]} failed branch(es) to portal."
            else
              PAYLOAD="{\"template\":\"$(json_escape "$TEMPLATE_REPO")\",\"conflicts\":$(json_string_array "${FAILED[@]}"),\"synced\":$(json_string_array "${PUSHED[@]}"),\"reasons\":$(json_reason_map "${FAILED[@]}")}"
              echo "Reporting sync results to portal: $PAYLOAD"
              curl --fail-with-body --max-time 15 \
                -X POST "$TEMPLATE_SYNC_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -H "X-Webhook-Secret: $TEMPLATE_SYNC_WEBHOOK_SECRET" \
                -d "$PAYLOAD" \
                || echo "::warning::sync report webhook POST failed (best-effort, ignored)."
            fi
          fi

          # --- Job summary table -------------------------------------------------
          {
            echo "## Template sync — main → site branches"
            echo ""
            echo "Discovered ${#BRANCHES[@]} branch(es): ${#PUSHED[@]} synced, ${#FAILED[@]} failed."
            echo ""
            echo "| Branch | Result |"
            echo "| --- | --- |"
            for B in "${PUSHED[@]}"; do echo "| $B | synced |"; done
            for B in "${FAILED[@]}"; do echo "| $B | ${REASON[$B]} |"; done
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # --- Exit nonzero only after every branch was attempted AND reported ---
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::Template sync finished with ${#FAILED[@]} failed branch(es): ${FAILED[*]}"
            exit 1
          fi
          echo "Template sync complete — ${#PUSHED[@]} branch(es) synced with no failures."
