name: Demo sites catch up to stable

# Cost cut V7.247. A release promote builds only `live` sites (see
# promote-stable.yml). The VivrealContent demo sites serve nobody's business,
# so they catch up once a week instead of on every promote: this builds each
# `demo` tier app whose last successful build is not `stable`'s head, pinned to
# that commit. An app already current is skipped, so a quiet week costs nothing.
#
# It NEVER moves `stable`. It only reads `stable`'s head and builds what is
# already released, so it cannot activate unreleased work on `main`. The token
# below is `contents: read`, so it could not push even by mistake.
#
# Before a walk, a reshoot or a showcase link, run this by hand so the demos are
# on current code. QA apps (`qa` tier) are only built by `tier: all`.
#
# RECOVERY FOR A PROMOTE. If the promote's fan-out failed (the AWS step, a
# StartJob error) or reported an app `busy`, run THIS workflow by hand with
# `tier: live` (or `all` for a security fix). It builds at `stable`'s head and
# skips every app already there. Never re-run the promote to recover: the
# promote re-reads `main` and would move `stable` again to whatever has merged
# since. The schedule always runs `demo`, whatever the input says; the script
# enforces that, so it is tested rather than remembered.
#
# Keep this FILENAME. The AWS role's trust policy names it.

on:
  schedule:
    # Wednesdays, 10:43 UTC (03:43 Pacific). Quiet for site traffic, and an odd
    # minute on purpose: cron slots are a cross-repo contract. Checked
    # 2026-10-17 against the anchored slots on the fleet's default branches:
    # GitHub Actions at daily 08:27 (vivreal-hq), Mon 09:17 (this repo), Mon
    # 15:00 to 16:00 and Sat 01:00 (the API repos and the portal); EventBridge
    # at daily 05:00, 06:00, 06:10, 06:30, 07:00 and 07:30, and Sun and Wed
    # 07:20 (Vivreal_EventHandler revalidateHookCleanupCron). Secure also runs
    # unanchored rate(6 hours) jobs. Nothing is anchored at 10:43 on Wednesday.
    # Check the ladder before moving it.
    - cron: '43 10 * * 3'
  workflow_dispatch:
    inputs:
      tier:
        description: "demo: the weekly catch-up. live: recover a promote whose fan-out failed. all: every site, for a security fix. Builds at stable's head only."
        type: choice
        options:
          - demo
          - live
          - all
        default: demo
      dry_run:
        description: "Plan only. No build starts; the run summary lists which sites are behind."
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: demo-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Read stable's head
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/stable" --jq .sha)"
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not read stable's head (got '$SHA'). Refusing to build."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Same role as promote-stable.yml, `VivrealTemplatesFleetBuild`.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.TEMPLATES_FLEET_BUILD_ROLE_ARN }}
          role-session-name: demo-catchup-${{ github.run_id }}
          aws-region: us-east-1

      # A scheduled run has no inputs, so TIER is empty and falls back to
      # demo here; fleet-build also forces demo on GITHUB_EVENT_NAME=schedule.
      - name: Build sites that are behind stable
        env:
          SHA: ${{ steps.stable.outputs.sha }}
          TIER: ${{ inputs.tier }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--commit "$SHA" --catchup "${TIER:-demo}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/fleet-build.mjs "${args[@]}"
